<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#21150e">
<base href="./">
<title>Malar — Handmade jewelry &amp; objects</title>
<style>
  html {background:#21150e}
  #garden-loader {
    position:fixed; inset:0; z-index:100; display:grid; place-items:center; margin:0;
    background:#21150e; transition:opacity 180ms ease-out;
  }
  .garden-loader-number {
    color:#fff; font:400 28px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-variant-numeric:tabular-nums;
  }
  #garden-loader.loaded {opacity:0}
  .garden-loading {overflow:hidden}
  @media (prefers-reduced-motion:reduce) {
    #garden-loader {transition:none}
  }
</style><script>
  document.documentElement.classList.add('garden-loading');
  if (!location.hash && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('relief-intro');
  }
  window.malarIntroFallback = setTimeout(() => {
    document.documentElement.classList.remove('garden-loading', 'relief-intro', 'relief-reveal');
    document.getElementById('garden-loader')?.remove();
  }, 15000);
  history.scrollRestoration = 'manual';
  window.addEventListener('pageshow', (event) => {
    if (!event.persisted && !location.hash) {
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
  });
</script>
<link rel="stylesheet" href="garden.css?v=title-shadow">
<link rel="stylesheet" href="proto/viewing-room/room.css?v=13">
<link rel="stylesheet" href="proto/viewing-room/metal.css?v=3">
<link rel="stylesheet" href="proto/viewing-room/bag.css?v=7">
<!-- Original relief and lighting, with a separate background scroll rate. -->
<script src="garden.js?v=gallery-3" defer></script>
<script type="module" src="proto/viewing-room/room.js?v=19"></script>
</head>
<body class="ambient-landing viewing-room">
<div id="garden-loader" role="progressbar" aria-label="Loading the garden" aria-valuemin="1" aria-valuemax="100" aria-valuenow="1"><span class="garden-loader-number" aria-hidden="true">1</span></div>
<noscript><style>#garden-loader{display:none}</style><p>Enable JavaScript to explore the collection.</p></noscript>
<header class="bar">
  <a class="mark" href="./" aria-label="Malar home">malar</a>
  <button id="collection-toggle" type="button" aria-controls="collection-index" aria-expanded="false" aria-label="Open collection index" hidden>Index</button>
  <button id="bag-open" class="bag-button" aria-haspopup="dialog" aria-expanded="false" aria-controls="bag">Bag <span id="bag-count">0</span></button>
  <div class="menu-disclosure">
    <button id="menu" type="button" aria-controls="site-links" aria-expanded="false">Menu <i aria-hidden="true"></i></button>
    <nav id="site-links" aria-label="Main" hidden>
      <a data-scroll="garden" href="#garden">The Garden</a>
      <a data-scroll="collection" href="#collection">Jewelry</a>
      <a data-scroll="crafts" href="#crafts">Objects</a>
      <a data-scroll="studio" href="#studio">Story</a>
      <a data-scroll="gift" href="#gift">Gift cards</a>
    </nav>
  </div>
</header>
<button id="sound" hidden aria-pressed="false">Sound off</button>

<main>
  <section class="stage" id="garden" aria-label="The collection">
    <div class="hero"><canvas aria-hidden="true"></canvas></div>
    <div class="axis"><h1 class="wordmark"><span class="wordmark-latin">MALAR</span><span class="wordmark-script" lang="ml">മലർ</span></h1></div>
    <div class="room" id="room">
      <div class="collection-track"><div class="collection-window">
        <div class="collection-gallery"><div class="collection-content"></div></div>
      </div></div>
    </div>
  </section>
</main>

<dialog id="bag" aria-labelledby="bag-title">
  <header class="bag-head">
    <h2 id="bag-title" tabindex="-1" autofocus>Bag</h2>
    <button type="button" id="bag-close">Close</button>
  </header>
  <ul id="bag-lines" aria-label="Items in your bag"></ul>
  <footer class="bag-footer">
    <p class="bag-total"><span>Total</span><span id="bag-total" aria-live="polite">$0</span></p>
    <button type="button" id="bag-checkout"><span>Checkout</span><span class="checkout-arrow" aria-hidden="true">↗</span></button>
    <p class="bag-disclaimer">Demo checkout. Nothing is charged.</p>
    <p id="bag-note" class="bag-note" role="status"></p>
  </footer>
</dialog>

</body>
</html>
