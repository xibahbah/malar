<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f9f8f5">
  <base href="../">
  <title>Shop — Malar</title>
  <link rel="stylesheet" href="proto/viewing-room/bag.css?v=9">
  <link rel="stylesheet" href="shop/shop.css?v=3">
  <script type="module" src="shop/shop.js?v=3"></script>
</head>
<body class="viewing-room shop-page">
<header class="shop-bar">
  <div class="menu-disclosure">
    <button id="menu" type="button" aria-controls="site-links" aria-expanded="false">Shop menu</button>
    <nav id="site-links" aria-label="Shop menu" hidden>
      <a href="shop/">Jewelry</a><a href="shop/?category=objects">Objects</a><a href="shop/?category=all">View all</a>
    </nav>
  </div>
  <a class="wordmark" href="./" aria-label="Malar home">malar</a>
  <button id="bag-open" aria-haspopup="dialog" aria-expanded="false" aria-controls="bag">Bag (<span id="bag-count">0</span>)</button>
</header>
<main>
  <section class="catalog" aria-labelledby="shop-title">
    <div class="catalog-header">
      <h1 id="shop-title">Shop</h1>
      <nav class="departments" aria-label="Shop categories">
        <a href="shop/" data-category="Jewelry">Jewelry</a>
        <a href="shop/?category=objects" data-category="Objects">Objects</a>
        <a href="shop/?category=all" data-category="All">View all</a>
      </nav>
    </div>
    <div class="collection-body">
      <div class="toolbar">
        <span id="piece-count" role="status"></span>
        <label class="catalog-search"><span aria-hidden="true"></span><input type="search" id="catalog-query" aria-label="Search this collection" placeholder="Search" maxlength="120"></label>
        <button id="refine-toggle" type="button" aria-expanded="false" aria-controls="refine">Filter &amp; sort</button>
      </div>
      <div id="refine" hidden>
        <label>Type<select id="catalog-type"></select></label>
        <label>Material<select id="catalog-material"></select></label>
        <label>Price<select id="catalog-price">
          <option value="">Any price</option><option value="under-50">Under $50</option><option value="50-75">$50–$75</option><option value="over-75">Over $75</option>
        </select></label>
        <label>Sort by<select id="catalog-sort">
          <option value="">Featured</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="name-asc">Name: A–Z</option><option value="name-desc">Name: Z–A</option>
        </select></label>
      </div>
      <button type="button" class="reset-filters" hidden>Clear filters</button>
      <div class="catalog-grid" id="catalog-products"></div>
      <p id="no-matches" hidden>No pieces match your filters.</p>
    </div>
  </section>
  <section id="detail" class="product-view" aria-labelledby="detail-name" hidden>
    <a class="back-link" href="shop/">Back to shop</a>
    <div class="product-layout">
      <div class="detail-photo"></div>
      <div class="product-copy">
        <p id="detail-type"></p>
        <h1 id="detail-name" tabindex="-1"></h1>
        <p id="detail-price"></p>
        <h2>Description</h2><p id="detail-description"></p>
        <h2>Material</h2><p id="detail-material"></p>
        <button class="detail-add" type="button">Add to bag</button>
      </div>
    </div>
  </section>
  <noscript>Enable JavaScript to browse the shop.</noscript>
</main>
<dialog id="bag" aria-labelledby="bag-title">
  <header class="bag-head">
    <h2 id="bag-title" tabindex="-1" autofocus>Bag</h2>
    <button type="button" id="bag-close">Close</button>
  </header>
  <ul id="bag-lines" aria-label="Items in your bag"></ul>
  <footer class="bag-footer">
    <p class="bag-total"><span>Total</span><span id="bag-total" aria-live="polite">$0</span></p>
    <button type="button" id="bag-checkout"><span>Checkout</span><span class="checkout-arrow" aria-hidden="true">↗</span></button>
    <p class="bag-disclaimer">Demo checkout. Nothing is charged.</p>
    <p id="bag-note" class="bag-note" role="status"></p>
  </footer>
</dialog>
</body>
</html>
