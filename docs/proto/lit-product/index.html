<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Malar / Shared light study</title><link rel="stylesheet" href="../proto.css"><style>.hero{position:relative;height:68vh;background:#21150e}.hero canvas{position:absolute;inset:0}.hero canvas:not(.ready){opacity:0}#garden{position:relative}#light-control{position:absolute;left:40%;bottom:25px;z-index:2}footer p{max-width:520px}</style><header><h1>One light. Two surfaces.</h1><a href="../garland-cart/">Garland cart</a><span class="note">Phase 1 / luminance-derived normals, not measured geometry</span></header><main id="garden"><div class="hero"><canvas aria-label="Wall and earrings shaded by one shared light" role="img"></canvas></div><button id="light-control">Focus light on earrings</button></main><footer><p>Move across the wall and earrings. Both use the same fragment pass, local lamp direction and specular exponent. The source photograph still contains baked shadows.</p><label>Keyboard light X <input id="light-x" type="range" min="0" max="100" value="50"></label><label>Y <input id="light-y" type="range" min="0" max="100" value="45"></label><output id="product-status" aria-live="polite">Loading textures...</output></footer><script src="engine.js"></script><script>const hero=document.querySelector('.hero');function light(){const r=hero.getBoundingClientRect();hero.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,clientX:r.left+r.width*document.querySelector('#light-x').value/100,clientY:r.top+r.height*document.querySelector('#light-y').value/100,pointerType:'mouse'}))}document.querySelectorAll('input').forEach(e=>e.oninput=light);document.querySelector('#light-control').onfocus=light;document.querySelector('#light-control').onclick=light;</script></html>
