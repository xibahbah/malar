<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Malar · Stone cards</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#271d18;color:#eee9df;font:15px Arial,sans-serif}header{max-width:1250px;margin:auto;padding:52px 28px 30px;display:flex;justify-content:space-between;align-items:end}h1{font:38px Georgia;margin:0 0 12px}p{color:#b8aa9c;line-height:1.6;margin:0}a{color:inherit}main{max-width:1250px;margin:auto;padding:12px 28px 80px;display:grid;grid-template-columns:repeat(3,1fr);gap:42px 32px}.stage{perspective:1400px}.card{position:relative;width:100%;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transform:translateY(var(--lift,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .45s cubic-bezier(.2,.7,.2,1)}.turn{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.23,.75,.2,1)}.card.flipped .turn{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:5px;backface-visibility:hidden;background-color:#e9e7df;background-image:url(stone-atlas.png);background-size:300% 200%;background-position:var(--pos);border:1px solid #f9f7f0;box-shadow:inset 0 1px 2px #fff,inset -2px -3px 3px #827a6955,0 5px 0 #bdb8ac,0 8px 1px #898174,0 18px 28px #0005;transform:translateZ(3px);overflow:hidden}.back{transform:rotateY(180deg) translateZ(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:35px;color:#51483d;text-align:center}.back h2{font:30px Georgia;font-weight:400}.back p{color:#70685d;font-size:14px}.back small{margin-top:40px}.front:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,#fff9 45%,transparent 65%);opacity:var(--shine,0);transform:translateX(var(--glint,-50%));transition:opacity .4s;pointer-events:none;mix-blend-mode:soft-light}.product{width:78%;height:78%;object-fit:contain;position:absolute;left:11%;top:9%;filter:drop-shadow(3px 7px 4px #57473655);transition:filter .4s}.card:hover .product{filter:drop-shadow(5px 11px 6px #57473666)}.caption{display:flex;justify-content:space-between;margin-top:25px;gap:15px;font:18px Georgia}.caption span+span{font:12px Arial;color:#b8aa9c}button:focus-visible{outline:2px solid #d2b77e;outline-offset:14px}.foot{max-width:1250px;padding:0 28px 50px;margin:auto;font-size:13px;color:#b8aa9c}@media(max-width:850px){main{grid-template-columns:repeat(2,1fr)}header{display:block}header>a{display:inline-block;margin-top:18px}}@media(max-width:500px){main{gap:30px 15px;padding:12px 18px 45px}.caption{font-size:15px}.caption span+span{display:none}.back{padding:15px}.back h2{font-size:20px}.back p{font-size:12px}.back small{margin-top:14px}h1{font-size:30px}}@media(prefers-reduced-motion:reduce){.card,.turn,.product{transition:none}}
</style>
<header><div><h1>Studies in pale stone</h1><p>Move gently to catch the light. Click to turn.</p></div><a href="./">Back to Malar</a></header><main id="grid"></main><div class="foot">Material & interaction study · Illustrative jewelry · Product artwork and details can be replaced independently.</div>
<script>
const materials=['Silver grain','Clouded stone','Jasmine corner','Lotus impression','Wildflower stem','Scattered blossoms'];
const product={image:'stone-earring.png',name:'Jasmine drop',description:'Antique-gold floral form with a pearl drop.',note:'Illustrative product · Preview'};
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
materials.forEach((name,i)=>{
const article=document.createElement('article');article.className='stage';
article.innerHTML='<button class="card" aria-label="Turn '+name+' card" aria-pressed="false" style="--pos:'+((i%3)*50)+'% '+(i<3?0:100)+'%"><div class="turn"><div class="face front"><img class="product" src="'+product.image+'" alt="Gold flower earring with pearl"></div><div class="face back"><h2>'+product.name+'</h2><p>'+product.description+'</p><small>'+product.note+'</small></div></div></button><div class="caption"><span>'+name+'</span><span>View details</span></div>';
const card=article.querySelector('button');
card.addEventListener('pointermove',e=>{if(reduced||e.pointerType==='touch')return;const r=article.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/card.offsetHeight-.5;card.style.setProperty('--rx',(-y*5)+'deg');card.style.setProperty('--ry',(x*6)+'deg');card.style.setProperty('--lift','-5px');card.style.setProperty('--shine','.45');card.style.setProperty('--glint',(x*70)+'%')});
card.addEventListener('pointerleave',()=>{['--rx','--ry','--lift','--shine'].forEach(p=>card.style.removeProperty(p))});
card.addEventListener('click',()=>{const flipped=card.classList.toggle('flipped');card.setAttribute('aria-pressed',flipped);card.setAttribute('aria-label',(flipped?'Return to ':'Turn ')+name+' card')});
document.querySelector('#grid').append(article);
});
</script></html>
